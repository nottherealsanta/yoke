# yoke.santa.build demo on the app VM. Public via the app tunnel
# (cloudflared → 127.0.0.1:8085).
#
# .env beside this file is written on the server and is never committed:
#   TAG=...            # written by the deploy workflow in the private santa.build repo
#   GROQ_API_KEY=...   # written by hand once, for the free demo tokens
#
# Bring-your-own-key visitors use this container as a bridge only; their key
# lives in the child process environment for one session.
services:
  yoke:
    image: santa-build/yoke:${TAG:?set TAG to the image tag}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:8080"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    pids_limit: 128
    cpus: 1.0
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in /srv/apps/yoke/.env}
      YOKE_DEMO_MODEL: ${YOKE_DEMO_MODEL:-llama-3.3-70b-versatile}
      YOKE_DEMO_MAX_SESSIONS: ${YOKE_DEMO_MAX_SESSIONS:-6}
      YOKE_DEMO_HOURLY_PER_IP: ${YOKE_DEMO_HOURLY_PER_IP:-3}
      YOKE_DEMO_DAILY_TOTAL: ${YOKE_DEMO_DAILY_TOTAL:-150}
      YOKE_DEMO_SESSION_MINUTES: ${YOKE_DEMO_SESSION_MINUTES:-15}
      YOKE_DEMO_IDLE_MINUTES: ${YOKE_DEMO_IDLE_MINUTES:-3}
      YOKE_DEMO_ORIGINS: ${YOKE_DEMO_ORIGINS:-https://yoke.santa.build,http://localhost,http://127.0.0.1}
